services:
  postgres:
    image: postgres:16-alpine
    container_name: digital_wallet_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-digital_wallet}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_wallet_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-digital_wallet}"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_wallet_data:
